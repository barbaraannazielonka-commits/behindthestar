<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behind the Star: 5 Classroom Cases</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a24;--bg2:#17382f;--plate:#f5f3ee;--ink:#12201c;--brass:#e0ad45;--red:#e2563f;--mute:#a9c1b8;--line:#2d5246;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0f2a24;--bg2:#17382f}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--plate);font-family:"Instrument Sans",system-ui,sans-serif;font-size:clamp(16px,1.35vw,21px);line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.1}
header{padding:1.2rem clamp(1rem,4vw,3rem) .6rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.5rem}
header h1{font-size:clamp(1.6rem,3vw,2.6rem)}
header p{margin:0;color:var(--mute)}
nav{display:flex;gap:.6rem;padding:.6rem clamp(1rem,4vw,3rem);overflow-x:auto}
nav button{flex:1 0 11rem;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--plate);padding:.7rem .9rem;border-radius:.9rem;font:inherit;cursor:pointer}
nav button b{display:block;font-family:Fraunces,serif;font-size:1.05em}
nav button .st{color:var(--brass);letter-spacing:.15em;font-size:.85em}
nav button[aria-selected=true]{background:var(--plate);color:var(--ink);border-color:var(--plate)}
nav button[aria-selected=true] .st{color:#a56d00}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
main{display:grid;grid-template-columns:1.05fr 1fr;gap:1.4rem;padding:1rem clamp(1rem,4vw,3rem) 3rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
.case{background:var(--plate);color:var(--ink);border-radius:1.2rem 1.2rem 2.6rem 1.2rem;padding:clamp(1.2rem,2.4vw,2.2rem)}
.case h2{font-size:clamp(1.7rem,3.2vw,3rem);margin-bottom:.2rem}
.tag{color:#7a5a12;font-weight:600;margin:0 0 .8rem}
.story{font-size:1.08em;max-width:60ch}
.vis{margin-top:1.2rem;background:#fff;border:1px solid #ddd8cc;border-radius:.9rem;padding:1rem}
.vis svg{width:100%;height:auto;display:block}
.vis small{color:#5b655f;display:block;margin-top:.5rem}
.panel{display:flex;flex-direction:column;gap:1rem}
.big{background:var(--brass);color:#2a1d00;border-radius:1.2rem;padding:1.2rem 1.4rem}
.big h3{font-size:clamp(1.3rem,2.3vw,2.1rem)}
.big p{margin:.5rem 0 0;font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:.5rem}
.tools button{flex:1 1 7rem;background:transparent;color:var(--plate);border:1.5px solid var(--mute);border-radius:99px;padding:.55rem 1rem;font:inherit;font-weight:600;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--plate);color:var(--ink);border-color:var(--plate)}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.3rem;min-height:12rem}
.box ul{margin:0;padding-left:1.1rem}
.box li{margin:.4rem 0}
.words{display:flex;flex-wrap:wrap;gap:.5rem}
.words span{background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .7rem}
.words b{color:var(--brass)}
.roles{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.roles button{background:var(--bg);color:var(--plate);border:1px solid var(--mute);border-radius:.6rem;padding:.35rem .8rem;font:inherit;cursor:pointer}
.roles button[aria-pressed=true]{background:var(--brass);color:#2a1d00;border-color:var(--brass)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.vote div{background:var(--bg);border-radius:.8rem;padding:.8rem;text-align:center}
footer{text-align:center;color:var(--mute);padding:1.5rem 1rem 2.5rem;border-top:1px solid var(--line);margin:0 clamp(1rem,4vw,3rem)}
.vote .n{font-family:Fraunces,serif;font-size:2.6rem;line-height:1}
.vote button{margin:.2rem;border:1px solid var(--mute);background:transparent;color:var(--plate);border-radius:.5rem;width:2.4rem;height:2.4rem;font-size:1.2rem;cursor:pointer}
.hint{color:var(--mute);font-size:.9em;margin-top:.7rem}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:9rem}
.bars i{flex:1;background:#2d5246;border-radius:.3rem .3rem 0 0;position:relative;font-style:normal;text-align:center;color:#fff;font-size:.8rem}
.bars i span{position:absolute;top:-1.3rem;left:0;right:0;color:#12201c}
.lab{display:flex;gap:.5rem}.lab em{flex:1;text-align:center;font-style:normal;font-size:.8rem;color:#5b655f}
.seg{display:flex;height:3.2rem;border-radius:.6rem;overflow:hidden;color:#fff;font-size:.8rem}
.seg i{display:flex;align-items:center;justify-content:center;font-style:normal;padding:0 .2rem;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.menu{border:1px dashed #b9b3a3;border-radius:.7rem;padding:.8rem;font-size:.9em}
.menu h4{margin:0 0 .4rem;font-family:Fraunces,serif;font-size:1.05rem}
.menu p{margin:.25rem 0;display:flex;justify-content:space-between;gap:.6rem}
.donut{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.ring{width:9.5rem;height:9.5rem;border-radius:50%}
.ring+ul{list-style:none;margin:0;padding:0}
.ring+ul li{margin:.25rem 0}.ring+ul li:before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;background:var(--c);margin-right:.5rem}
@media(prefers-reduced-motion:no-preference){.case,.big{animation:in .35s ease}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><h1>Behind the Star</h1><p>Five cases about pressure, money and pride in top kitchens. Pick a case, read it out, then talk. Use ← → to switch.</p></header>
<nav id="nav" role="tablist" aria-label="Cases"></nav>
<main>
 <article class="case" id="case"></article>
 <section class="panel">
  <div class="big" id="big"></div>
  <div class="tools" id="tools"></div>
  <div class="box" id="box"></div>
 </section>
</main>
<footer>Nannestad High School – Barbara Anna Zielonka</footer>
<script>
var S='<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-.12em"><path fill="currentColor" d="M12 1.5l2.6 7.1 7.4.3-5.8 4.6 2 7.3L12 16.7 5.8 20.8l2-7.3L2 8.9l7.4-.3z"/></svg>';
function stars(n){return n===0?'Bib Gourmand':n===9?'Green Star':new Array(n+1).join(S)}
var cases=[
{tab:'The Inspector',st:1,title:'The Quiet Guest at Table 7',tag:'Honesty · Service · Secret inspectors',
story:'Friday night at a one-star restaurant. A guest at Table 7 sits alone, orders the full menu, writes in a small notebook and pays in cash. Nobody can prove it, but half the team whispers: “That’s an inspector.” Then the fish course goes out a bit overcooked. The runner has already left the pass.',
vis:function(){var t=[[60,60],[130,60],[200,60],[60,130],[130,130],[270,130]];var c=t.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="#e8e4d8" stroke="#bbb5a3"/>'}).join('');return '<svg viewBox="0 0 400 190" role="img" aria-label="Floor plan"><rect x="2" y="2" width="396" height="186" rx="10" fill="#fbfaf6" stroke="#ddd8cc"/>'+c+'<circle cx="200" cy="130" r="20" fill="#e0ad45"/><text x="200" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1d00">7</text><rect x="310" y="20" width="76" height="150" rx="8" fill="#17382f"/><text x="348" y="100" text-anchor="middle" fill="#f5f3ee" font-size="13">Kitchen</text><text x="200" y="172" text-anchor="middle" font-size="11" fill="#5b655f">solo guest · notebook · cash</text></svg><small>Floor plan: Table 7 is highlighted.</small>'},
q:'Do you send the dish, fix it quietly, or stop it and tell the guest? Would your answer change if it was an ordinary guest?',
sides:['Fix it, remake the dish','Send it, it’s fine'],
stuck:['What does the guest see and feel in each option?','Who should make the decision: the cook, the sous chef or the chef?','If the guest is a regular person, is the risk different?','How should a kitchen treat every table the same?','What does “consistency” mean to you?'],
words:[['consistency','same quality every time'],['pass','where finished plates are checked'],['remake','cook the dish again'],['responsible','you own the mistake and fix it'],['standard','the level you refuse to go below'],['secret','nobody knows who they are']],
roles:{'Chef':'“Every plate is the standard. I would rather lose four minutes than send something I wouldn’t eat.”','Guest':'“I don’t care who I am. I care that it is right, and that nobody lies to me.”','Owner':'“A remake costs a few euros. A bad review costs far more.”','Inspector':'“I judge the whole meal and whether it is the same on every visit.”'}},
{tab:'The Price of Pressure',st:3,title:'Ninety-Four Hours',tag:'Health · Team culture · Trainees',
story:'A three-star kitchen is world famous. Its commis chefs work six days a week and an unpaid trainee (a “stagiaire”) works the same hours for “experience”. Yesterday a young cook cried quietly at the pass, then went back to work. The head chef says: “This is how top quality is made.” A cook says: “I’m not sure it is worth it.”',
vis:function(){var d=[['Mon',13],['Tue',14],['Wed',14],['Thu',15],['Fri',16],['Sat',16],['Sun',6]];return '<div class="bars">'+d.map(function(x){return '<i style="height:'+x[1]/16*100+'%"><span>'+x[1]+'h</span></i>'}).join('')+'</div><div class="lab">'+d.map(function(x){return '<em>'+x[0]+'</em>'}).join('')+'</div><small>One commis chef’s week: 94 hours in total.</small>'},
q:'Can a kitchen make top food and still be a good place to work? What would you change first?',
sides:['Pressure is part of the job','Pressure must be limited'],
stuck:['What is the difference between hard work and unfair work?','Who benefits when staff work 94 hours? Who pays?','Would you work there for one year to learn? Why or why not?','A real chef once handed back his three stars to cook with less stress. What does that tell us?','What could a good manager change tomorrow?'],
words:[['burnout','so tired from work you can’t go on'],['brigade','the kitchen team'],['stagiaire','unpaid or low paid trainee'],['boundaries','limits you set for yourself'],['turnover','how often staff leave'],['fair pay','a wage that matches the work']],
roles:{'Chef':'“I suffered to learn this craft. I want to teach hard work and order.”','Commis':'“I love cooking. I can’t love it if I never sleep.”','Owner':'“If staff leave, quality falls and training costs double.”','Union rep':'“Passion is not a reason to ignore the working time rules.”'}},
{tab:'Stars vs. Profit',st:2,title:'The €185 Menu',tag:'Costs · Pricing · Business',
story:'Restaurant Nord has two stars and is fully booked for three months, yet it barely makes money. A guest pays €185 for the tasting menu. The owner wants to protect profit by buying cheaper fish and cutting one cook. The chef says the star depends on the best ingredients and a full team.',
vis:function(){var s=[['Ingredients',28,'#2d5246'],['Staff',42,'#17382f'],['Rent, energy',18,'#6b7d74'],['Other',6,'#8b8b7a'],['Profit',6,'#c28a1a']];return '<div class="seg">'+s.map(function(x){return '<i style="width:'+x[1]+'%;background:'+x[2]+'">'+(x[1]>10?x[0]+' ':'')+x[1]+'%</i>'}).join('')+'</div><small>Where €185 goes: only about €11 is profit. Small bars: Other 6%, Profit 6%.</small>'},
q:'Where would you cut, raise the price or change the menu? What are you willing to risk?',
sides:['Protect quality, raise price','Cut costs, protect profit'],
stuck:['What does 6% profit mean when something goes wrong?','Would guests pay €210? Who stops coming?','Which cost is the biggest? Is it the easiest to cut?','Could the menu use cheaper but still very good ingredients?','What would an inspector notice first?'],
words:[['margin','profit left after costs'],['food cost','what ingredients cost per dish'],['overheads','costs you pay every month'],['yield','how much you can use after cutting'],['value for money','is the price worth it?'],['fully booked','no free tables']],
roles:{'Chef':'“If we change the fish, I change the dish. I cannot hide it.”','Owner':'“Staff need pay on time. A star does not pay the electricity bill.”','Guest':'“At this price I expect everything to be perfect.”','Accountant':'“Raise prices 8 percent and the problem is nearly solved.”'}},
{tab:'Chasing the Star',st:0,title:'The Bistro That Changed',tag:'Who we are · Guests · Big goals',
story:'Chez Marta is a loved neighbourhood bistro with a Bib Gourmand, the Michelin award for good food at fair prices. The new chef wants a star. She replaces hearty favourites with a tiny tasting menu. Reviewers are excited. Regulars say: “It’s not for us anymore.” Half the tables are empty on weekdays.',
vis:function(){return '<div class="two"><div class="menu"><h4>Before</h4><p><span>Braised pork cheek</span><b>€16</b></p><p><span>Fish soup</span><b>€12</b></p><p><span>Apple tart</span><b>€8</b></p></div><div class="menu"><h4>After</h4><p><span>Cep, barley, pine oil</span><b>€34</b></p><p><span>Langoustine, kombu</span><b>€42</b></p><p><span>Tasting menu</span><b>€130</b></p></div></div><small>Same restaurant, a few months apart.</small>'},
q:'Is it right to change a restaurant to chase a star? Who is the restaurant really for?',
sides:['Go for the star','Keep serving the regulars'],
stuck:['What makes a restaurant special and different?','Who pays when the star does not come?','Can you do both? How?','What did the neighbourhood lose?','What would you ask the regulars before changing the menu?'],
words:[['regulars','guests who come often'],['identity','what makes a place special'],['ambition','a strong wish to do better'],['target guest','who you cook for'],['trend','what is fashionable now'],['loyalty','staying with a place']],
roles:{'Chef':'“I want to show what I can do. I can’t hold back forever.”','Regular':'“I was here every Friday for nine years. Where do I go now?”','Owner':'“A star could bring visitors, but it could also close us.”','Critic':'“Big goals are good. Leaving your guests behind is not.”'}},
{tab:'The Green Star',st:9,title:'Thirty-Eight Percent in the Bin',tag:'Caring for the planet · Waste · Local food',
story:'A kitchen wants the Michelin Green Star, the award for kitchens that care for the planet. A check of the waste shows that most of what goes in the bin never reached a guest. The chef wants to use trim, change suppliers to local farms and shrink the menu. Suppliers cost more and the team says they have no time.',
vis:function(){return '<div class="donut"><div class="ring" style="background:conic-gradient(#e2563f 0 38%,#e0ad45 38% 65%,#6b9a86 65% 85%,#8b8b7a 85% 100%)"></div><ul><li style="--c:#e2563f">Peelings and trim 38%</li><li style="--c:#e0ad45">Plate leftovers 27%</li><li style="--c:#6b9a86">Expired stock 20%</li><li style="--c:#8b8b7a">Overproduction 15%</li></ul></div><small>One week of kitchen waste, by source.</small>'},
q:'Which waste would you tackle first, and who in the kitchen must change what they do?',
sides:['Start with trim','Start with sourcing'],
stuck:['Which of these four can the team control straight away?','How can trim become a dish, a stock or a staff meal?','What does “local” cost, and what does it save?','Will guests accept a smaller menu?','Who checks that the change lasts?'],
words:[['sustainable','good for the planet and can last'],['seasonal','grown at this time of year'],['nose to tail','use the whole animal'],['audit','a careful check'],['compost','turning waste into soil'],['supply chain','route from farm to plate']],
roles:{'Chef':'“Using everything is a skill. It makes the cooking more creative.”','Farmer':'“If you commit to buying all year, I can plan my fields.”','Owner':'“Waste is money in the bin. I want to see it fall.”','Commis':'“Show me the system and I will follow it.”'}}
];
var cur=0,tool='stuck',role=null,votes=cases.map(function(){return[0,0]});
var nav=document.getElementById('nav');
cases.forEach(function(c,i){var b=document.createElement('button');b.setAttribute('role','tab');b.innerHTML='<span class="st">'+stars(c.st)+'</span><b>'+c.tab+'</b>';b.onclick=function(){go(i)};nav.appendChild(b)});
function go(i){cur=(i+cases.length)%cases.length;tool='stuck';role=null;render()}
function render(){
 var c=cases[cur];
 Array.prototype.forEach.call(nav.children,function(b,i){b.setAttribute('aria-selected',i===cur)});
 document.getElementById('case').innerHTML='<h2>'+c.title+'</h2><p class="tag">'+c.tag+'</p><p class="story">'+c.story+'</p><div class="vis">'+c.vis()+'</div>';
 document.getElementById('big').innerHTML='<h3>Discuss</h3><p>'+c.q+'</p>';
 var T=[['stuck','Stuck? Ask this'],['words','Useful words'],['roles','Viewpoints'],['vote','Class vote']];
 var t=document.getElementById('tools');t.innerHTML='';
 T.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];b.setAttribute('aria-pressed',tool===x[0]);b.onclick=function(){tool=x[0];render()};t.appendChild(b)});
 var h='';
 if(tool==='stuck')h='<ul>'+c.stuck.map(function(q){return'<li>'+q+'</li>'}).join('')+'</ul>';
 if(tool==='words')h='<div class="words">'+c.words.map(function(w){return'<span><b>'+w[0]+'</b> · '+w[1]+'</span>'}).join('')+'</div><p class="hint">Challenge: use three of these words in your answer.</p>';
 if(tool==='roles'){var k=Object.keys(c.roles);h='<div class="roles">'+k.map(function(r){return'<button aria-pressed="'+(role===r)+'" data-r="'+r+'">'+r+'</button>'}).join('')+'</div><p>'+(role?c.roles[role]:'Pick a role. Do you agree with them?')+'</p>'}
 if(tool==='vote'){var v=votes[cur];h='<div class="vote">'+c.sides.map(function(s,j){return'<div><div>'+s+'</div><div class="n">'+v[j]+'</div><button data-v="'+j+'" data-d="-1" aria-label="minus one">−</button><button data-v="'+j+'" data-d="1" aria-label="plus one">+</button></div>'}).join('')+'</div><p class="hint">Count hands, then ask one student from each side to explain why.</p>'}
 var box=document.getElementById('box');box.innerHTML=h;
 Array.prototype.forEach.call(box.querySelectorAll('[data-r]'),function(b){b.onclick=function(){role=b.dataset.r;render()}});
 Array.prototype.forEach.call(box.querySelectorAll('[data-v]'),function(b){b.onclick=function(){var v=votes[cur],j=+b.dataset.v;v[j]=Math.max(0,v[j]+ +b.dataset.d);render()}});
}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
render();
</script>
</body>
</html>
